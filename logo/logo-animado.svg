<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295.2 64" role="img" aria-label="WebXpress">
<style>
.b,.l,.x1,.x2,.sp,.st{transform-box:fill-box;transform-origin:center}
.b{animation:pop .7s cubic-bezier(.2,1.1,.3,1.25) backwards}
.x1{animation:s1 .5s cubic-bezier(.2,.9,.3,1) .35s backwards}
.x2{animation:s2 .5s cubic-bezier(.2,.9,.3,1) .5s backwards}
.sp{transform-origin:right center;animation:sp 3.8s ease-out .85s infinite backwards}
.sp2{animation-delay:.95s}
.l{animation:rise .6s cubic-bezier(.2,.9,.3,1.25) calc(.8s + var(--i)*.06s) backwards}
.lx{animation:xpop .8s cubic-bezier(.2,1.2,.3,1.3) 1.05s backwards,xbeat 3.8s ease-in-out 3.2s infinite}
.gl{animation:gl 3.8s cubic-bezier(.5,0,.3,1) 1.25s infinite backwards}
.st{animation:st 3.8s ease-out 1.5s infinite backwards}
@keyframes pop{from{opacity:0;transform:scale(.55) rotate(-12deg)}60%{opacity:1}}
@keyframes s1{from{opacity:0;transform:translate(-16px,-16px)}}
@keyframes s2{from{opacity:0;transform:translate(16px,16px)}}
@keyframes sp{0%{opacity:0;transform:scaleX(0)}12%{transform:scaleX(1)}100%{}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.85)}}
@keyframes xpop{from{opacity:0;transform:scale(0) rotate(-140deg)}}
@keyframes xbeat{0%,18%,100%{transform:none}9%{transform:scale(1.18) rotate(8deg)}}
@keyframes gl{0%{transform:translateX(-70px)}22%,100%{transform:translateX(140px)}}
@keyframes st{0%{opacity:0;transform:scale(0) rotate(0)}8%{opacity:1;transform:scale(1.15) rotate(45deg)}20%,100%{opacity:0;transform:scale(0) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.gl,.st{opacity:0}}
</style>
